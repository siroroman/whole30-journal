name: iosApp
options:
  bundleIdPrefix: dev.whole30journal
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_NAME: iosApp
        PRODUCT_BUNDLE_IDENTIFIER: dev.whole30journal.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: iosApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Whole30 Journal"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../shared/umbrella/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        # SQLDelight's native driver (pulled in transitively via SharedKit -> core:database) needs
        # the system sqlite3 symbols - the app linking SharedKit.framework must supply them itself.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
        # SKIE's swiftBundling embeds a Swift overlay in SharedKit.framework as a binary
        # .swiftmodule with no .swiftinterface. Xcode's explicit-module dependency scanner only
        # finds the framework's Clang/ObjC side in that case (silently dropping the Swift overlay
        # from the SharedKit.HomeScreenViewController-style free functions SKIE generates), so
        # explicit modules must stay off for this target.
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint lint --config "$SRCROOT/../config/swiftlint/.swiftlint.yml"
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        basedOnDependencyAnalysis: false
      - name: "Build KMP Shared Framework"
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:umbrella:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false

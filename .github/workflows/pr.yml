name: PR Checks

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew detekt --no-daemon

  test:
    name: Kotlin tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # jvmTest is where the repository tests actually run (see shared/core/database's
      # build.gradle.kts - jvm() exists solely so these tests run fast via the JDBC driver).
      # allTests also pulls in iosSimulatorArm64Test, which needs a macOS host to even compile.
      - run: ./gradlew jvmTest testDebugUnitTest --no-daemon

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
          if-no-files-found: ignore
